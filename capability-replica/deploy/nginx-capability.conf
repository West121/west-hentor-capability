server {
    listen 8102;
    server_name _;

    root /usr/local/nginx/html/capability;
    index index.html index.htm;

    access_log /usr/local/nginx/logs/capability.access.log;
    error_log /usr/local/nginx/logs/capability.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_connect_timeout 800s;
        proxy_send_timeout 800s;
        proxy_read_timeout 800s;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:9901/api/;
    }

    location /AbilityTable/ {
        proxy_connect_timeout 800s;
        proxy_send_timeout 800s;
