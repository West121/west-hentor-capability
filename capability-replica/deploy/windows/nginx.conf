worker_processes  auto;

error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    # An upstream TLS gateway may forward HTTPS traffic to this internal Nginx over HTTP.
    # Preserve its original scheme when available instead of replacing it with the inner hop.
    map $http_x_forwarded_proto $client_scheme {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    server {
        listen 80;
        server_name 10.169.1.7 cnrrtcms.sgs.net;

        root D:/apps/capability/frontend/dist;
        index index.html;

        location /assets/ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # The application retains several original non-/api upload/download paths.
        location ~ ^/(api|AbilityTable|File|DemoUiComponents|Users|Profile|UEditor|TenantCustomization)(/|$) {
            proxy_pass http://127.0.0.1:9901;
            proxy_http_version 1.1;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $client_scheme;
        }

        location /swagger-ui/ {
            proxy_pass http://127.0.0.1:9901;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $client_scheme;
        }

        location /v3/api-docs {
            proxy_pass http://127.0.0.1:9901;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $client_scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
