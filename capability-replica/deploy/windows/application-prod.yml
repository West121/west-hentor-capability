server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:9901}

app:
  server-root-address: ${APP_SERVER_ROOT_ADDRESS:http://localhost/}
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

replica:
  store:
    mode: database

spring:
  application:
    name: capability-replica
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  file:
    name: D:/apps/capability/logs/backend-spring.log

payment:
  paypal:
    is-active: false
    client-id: ""
    demo-username: ""
    demo-password: ""
  stripe:
    is-active: false
    publishable-key: ""
